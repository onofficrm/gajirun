name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gajirun-ftp-deploy
  cancel-in-progress: true

jobs:
  purge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Mirror clean site over public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          FTP_PORT="${FTP_PORT:-21}"
          FTP_SERVER="${FTP_SERVER#ftp://}"
          FTP_SERVER="${FTP_SERVER#ftps://}"
          FTP_SERVER="${FTP_SERVER#sftp://}"
          FTP_SERVER="${FTP_SERVER%%/*}"
          echo "host=${FTP_SERVER} port=${FTP_PORT}"

          LIST=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<'EOF' || true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 5
          set net:timeout 30
          set cmd:fail-exit no
          ls
          bye
          EOF
          )
          echo "$LIST"

          REMOTE_DIR="."
          if echo "$LIST" | grep -Eq '(^|[[:space:]])public_html(/|[[:space:]]|$)'; then
            REMOTE_DIR="public_html"
          elif echo "$LIST" | grep -Eq '(^|[[:space:]])www(/|[[:space:]]|$)'; then
            REMOTE_DIR="www"
          elif echo "$LIST" | grep -Eqi 'index\.html|wp-admin|\.htaccess'; then
            echo "FTP home already looks like the web root"
            REMOTE_DIR="."
          else
            echo "trying public_html anyway"
            REMOTE_DIR="public_html"
          fi
          echo "Using remote directory: $REMOTE_DIR"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 8
          set net:reconnect-interval-base 3
          set net:timeout 45
          set ftp:list-options -a
          set xfer:clobber true
          set cmd:fail-exit no
          cd $REMOTE_DIR || cd /public_html || cd public_html || echo "stay in home"
          pwd
          ls
          mirror --reverse --delete --verbose --parallel=2 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob README.md \
            --exclude-glob .DS_Store \
            ./ .
          bye
          EOF

      - name: Neutralize leftover PHP and verify
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import ftplib
          import io
          import os
          import socket
          import time

          socket.setdefaulttimeout(45)

          raw_host = os.environ["FTP_SERVER"].strip()
          for prefix in ("ftp://", "ftps://", "sftp://"):
              if raw_host.startswith(prefix):
                  raw_host = raw_host[len(prefix):]
          host = raw_host.split("/")[0]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          port = int(os.environ.get("FTP_PORT") or "21")

          SKIP_NAMES = {".", ".."}
          EXEC_EXT = (
              ".php", ".phtml", ".phar", ".php3", ".php4", ".php5", ".php7",
              ".cgi", ".pl", ".asp", ".aspx", ".jsp", ".suspected",
          )
          EXEC_NAMES = {".user.ini", "user.ini", ".php.ini", "php.ini"}
          CLEAN = b"<?php\n// removed\n"

          ftp = None

          def connect():
              client = ftplib.FTP()
              client.connect(host, port, timeout=45)
              client.login(user, password)
              client.set_pasv(True)
              client.encoding = "latin-1"
              return client

          def retry(fn, tries=4):
              last = None
              for i in range(tries):
                  try:
                      ftp.voidcmd("NOOP")
                      return fn()
                  except Exception as e:
                      last = e
                      print(f"retry {i+1}: {e}", flush=True)
                      time.sleep(1 + i)
                      try:
                          ftp.close()
                      except Exception:
                          pass
                      globals()["ftp"] = connect()
              raise last

          def list_entries():
              items = []
              try:
                  for name, facts in ftp.mlsd():
                      if name not in SKIP_NAMES:
                          items.append((name, facts.get("type") == "dir"))
                  return items
              except Exception:
                  pass
              lines = []
              ftp.retrlines("LIST", lines.append)
              for line in lines:
                  if "<DIR>" in line.upper():
                      name = line.split("<DIR>")[-1].strip()
                      if name and name not in SKIP_NAMES:
                          items.append((name, True))
                      continue
                  parts = line.split(maxsplit=8)
                  if len(parts) >= 9:
                      name = parts[8]
                      if name not in SKIP_NAMES:
                          items.append((name, line.startswith("d") or line.startswith("l")))
              return items

          def is_exec(name, is_dir):
              lower = name.lower()
              if is_dir:
                  return False
              if lower in EXEC_NAMES:
                  return True
              return any(lower.endswith(ext) for ext in EXEC_EXT) or lower.endswith(".php.bak") or lower.endswith(".php.old")

          ftp = connect()
          print(f"connected host={host} port={port}", flush=True)
          webroot = None
          for path in ("/public_html", "public_html", "/www", "www"):
              try:
                  ftp.cwd(path)
                  webroot = ftp.pwd()
                  break
              except Exception as e:
                  print(f"skip {path}: {e}", flush=True)
          if not webroot:
              raise SystemExit("public_html not found")
          print(f"webroot={webroot}", flush=True)

          leftovers = []
          neutralized = []

          def walk(path, depth=0):
              if depth > 20:
                  return
              def listing():
                  ftp.cwd(path)
                  return list_entries()
              try:
                  entries = retry(listing)
              except Exception as e:
                  print(f"skip list {path}: {e}", flush=True)
                  return
              for name, is_dir in entries:
                  child = path.rstrip("/") + "/" + name
                  if is_exec(name, is_dir):
                      leftovers.append(child)
                      def neutralize():
                          ftp.cwd(path)
                          ftp.storbinary(f"STOR {name}", io.BytesIO(CLEAN))
                          try:
                              ftp.rename(name, name + ".removed.txt")
                          except Exception:
                              pass
                      try:
                          retry(neutralize)
                          neutralized.append(child)
                          print(f"neutralized {child}", flush=True)
                      except Exception as e:
                          print(f"could not neutralize {child}: {e}", flush=True)
                      continue
                  if is_dir:
                      walk(child, depth + 1)

          walk(webroot)

          remain = []
          def walk2(path, depth=0):
              if depth > 20:
                  return
              def listing():
                  ftp.cwd(path)
                  return list_entries()
              try:
                  entries = retry(listing)
              except Exception as e:
                  print(f"verify skip {path}: {e}", flush=True)
                  return
              for name, is_dir in entries:
                  child = path.rstrip("/") + "/" + name
                  if is_exec(name, is_dir):
                      remain.append(child)
                      continue
                  if is_dir:
                      walk2(child, depth + 1)

          walk2(webroot)
          try:
              ftp.quit()
          except Exception:
              pass

          print("found executables: " + (", ".join(leftovers) if leftovers else "none"), flush=True)
          print("neutralized: " + (", ".join(neutralized) if neutralized else "none"), flush=True)
          print("remaining executables: " + (", ".join(remain) if remain else "none"), flush=True)
          unhandled = [path for path in remain if path not in neutralized]
          if unhandled:
              raise SystemExit("malware leftovers remain: " + ", ".join(unhandled))
          print("VERIFY OK: leftover PHP names were overwritten or removed", flush=True)
          PY
