name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gajirun-ftp-deploy
  cancel-in-progress: true

jobs:
  purge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upload site and neutralize PHP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import ftplib
          import io
          import os
          import socket
          import time
          import traceback
          from pathlib import Path

          socket.setdefaulttimeout(30)

          raw_host = os.environ["FTP_SERVER"].strip()
          for prefix in ("ftp://", "ftps://", "sftp://"):
              if raw_host.startswith(prefix):
                  raw_host = raw_host[len(prefix):]
          host = raw_host.split("/")[0]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          port = int(os.environ.get("FTP_PORT") or "21")
          print(f"host={host} port={port} user={user}", flush=True)

          SKIP_NAMES = {".", ".."}
          EXEC_EXT = (
              ".php", ".phtml", ".phar", ".php3", ".php4", ".php5", ".php7",
              ".cgi", ".pl", ".asp", ".aspx", ".jsp", ".suspected",
          )
          EXEC_NAMES = {".user.ini", "user.ini", ".php.ini", "php.ini"}
          CLEAN = b"<?php\n// removed\n"
          LOCAL_ROOT = Path(".")
          LOCAL_FILES = [
              "index.html", "rehab.html", "bankruptcy.html", "process.html",
              "faq.html", "consult.html", "privacy.html", ".htaccess",
          ]
          LOCAL_DIRS = ["css", "js"]

          ftp = None

          def connect():
              client = ftplib.FTP()
              client.connect(host, port, timeout=30)
              client.login(user, password)
              client.set_pasv(True)
              client.encoding = "latin-1"
              return client

          def retry(fn, tries=3):
              last = None
              for i in range(tries):
                  try:
                      if ftp is not None:
                          ftp.voidcmd("NOOP")
                      return fn()
                  except Exception as e:
                      last = e
                      print(f"retry {i+1}: {e}", flush=True)
                      time.sleep(1 + i)
                      try:
                          if ftp is not None:
                              ftp.close()
                      except Exception:
                          pass
                      globals()["ftp"] = connect()
              raise last

          def list_entries():
              items = []
              try:
                  for name, facts in ftp.mlsd():
                      if name not in SKIP_NAMES:
                          items.append((name, facts.get("type") == "dir"))
                  return items
              except Exception as e:
                  print(f"mlsd fallback: {e}", flush=True)
              lines = []
              try:
                  ftp.retrlines("LIST", lines.append)
              except Exception as e:
                  print(f"list failed: {e}", flush=True)
                  return items
              for line in lines:
                  if "<DIR>" in line.upper():
                      name = line.split("<DIR>")[-1].strip()
                      if name and name not in SKIP_NAMES:
                          items.append((name, True))
                      continue
                  parts = line.split(maxsplit=8)
                  if len(parts) >= 9:
                      name = parts[8]
                      if name not in SKIP_NAMES:
                          items.append((name, line.startswith("d") or line.startswith("l")))
              return items

          def is_exec(name, is_dir):
              lower = name.lower()
              if is_dir:
                  return False
              if lower in EXEC_NAMES:
                  return True
              return any(lower.endswith(ext) for ext in EXEC_EXT) or lower.endswith(".php.bak") or lower.endswith(".php.old")

          try:
              ftp = connect()
          except Exception:
              traceback.print_exc()
              raise SystemExit("FTP login failed")

          print("connected", flush=True)
          try:
              home = ftp.pwd()
          except Exception:
              home = "/"
          print(f"ftp home={home}", flush=True)

          webroot = None
          for path in ("/public_html", "public_html", "/www", "www"):
              try:
                  try:
                      ftp.cwd(home)
                  except Exception:
                      pass
                  ftp.cwd(path)
                  webroot = ftp.pwd()
                  print(f"webroot via {path} -> {webroot}", flush=True)
                  break
              except Exception as e:
                  print(f"skip {path}: {e}", flush=True)

          if webroot is None:
              try:
                  ftp.cwd(home)
                  ftp.mkd("public_html")
                  print("created public_html", flush=True)
              except Exception as e:
                  print(f"mkd public_html: {e}", flush=True)
              try:
                  ftp.cwd(home)
                  ftp.cwd("public_html")
                  webroot = ftp.pwd()
              except Exception:
                  webroot = home
              print(f"fallback webroot={webroot}", flush=True)

          print("=== upload clean site ===", flush=True)

          def upload_file(local: Path, remote_dir: str, remote_name: str):
              def put():
                  ftp.cwd(remote_dir)
                  with local.open("rb") as fh:
                      ftp.storbinary(f"STOR {remote_name}", fh)
                  print(f"uploaded {remote_dir.rstrip('/')}/{remote_name}", flush=True)
              retry(put)

          def ensure_dir(remote_dir: str):
              def mk():
                  try:
                      ftp.cwd(remote_dir)
                      return
                  except Exception:
                      pass
                  parent = remote_dir.rsplit("/", 1)[0] or webroot
                  base = remote_dir.rstrip("/").split("/")[-1]
                  try:
                      ftp.cwd(parent)
                  except Exception:
                      ftp.cwd(webroot)
                  try:
                      ftp.mkd(base)
                  except Exception:
                      pass
                  ftp.cwd(remote_dir)
              retry(mk)

          uploaded = 0
          for name in LOCAL_FILES:
              path = LOCAL_ROOT / name
              if not path.exists():
                  print(f"missing local {name}", flush=True)
                  continue
              upload_file(path, webroot, name)
              uploaded += 1
          for dirname in LOCAL_DIRS:
              remote_dir = webroot.rstrip("/") + "/" + dirname
              ensure_dir(remote_dir)
              local_dir = LOCAL_ROOT / dirname
              if not local_dir.exists():
                  continue
              for path in local_dir.rglob("*"):
                  if path.is_dir():
                      ensure_dir(remote_dir + "/" + path.relative_to(local_dir).as_posix())
                  else:
                      parent = path.relative_to(local_dir).parent.as_posix()
                      dest = remote_dir if parent == "." else remote_dir + "/" + parent
                      upload_file(path, dest, path.name)
                      uploaded += 1

          if uploaded < 1:
              raise SystemExit("no files uploaded")
          print(f"uploaded {uploaded} files", flush=True)

          print("=== neutralize PHP/webshells ===", flush=True)
          leftovers = []
          neutralized = []

          def walk(path, depth=0):
              if depth > 8:
                  return
              def listing():
                  ftp.cwd(path)
                  return list_entries()
              try:
                  entries = retry(listing)
              except Exception as e:
                  print(f"skip list {path}: {e}", flush=True)
                  return
              for name, is_dir in entries:
                  child = path.rstrip("/") + "/" + name
                  if is_exec(name, is_dir):
                      leftovers.append(child)
                      def neutralize():
                          ftp.cwd(path)
                          ftp.storbinary(f"STOR {name}", io.BytesIO(CLEAN))
                          try:
                              ftp.delete(name)
                          except Exception:
                              try:
                                  ftp.rename(name, name + ".removed.txt")
                              except Exception:
                                  pass
                      try:
                          retry(neutralize)
                          neutralized.append(child)
                          print(f"neutralized {child}", flush=True)
                      except Exception as e:
                          print(f"could not neutralize {child}: {e}", flush=True)
                      continue
                  if is_dir:
                      walk(child, depth + 1)

          try:
              walk(webroot)
          except Exception:
              traceback.print_exc()
              print("neutralize walk failed, site upload already done", flush=True)

          try:
              ftp.quit()
          except Exception:
              pass

          print("found executables: " + (", ".join(leftovers) if leftovers else "none"), flush=True)
          print("neutralized: " + str(len(neutralized)), flush=True)
          print("UPLOAD OK", flush=True)
          PY
